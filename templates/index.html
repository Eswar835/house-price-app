<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>

    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                url("{{ url_for('static', filename='house_image.jpg') }}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Top Buttons */
        .top-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
        }

        .top-buttons a button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .profile-btn {
            background: #9b59b6;
        }

        .profile-btn:hover {
            background: #8e44ad;
            transform: translateY(-2px);
        }

        .history-btn {
            background: #3498db;
        }

        .history-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .logout-btn {
            background: #e74c3c;
        }

        .logout-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        /* Main Container */
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 15px;
            width: 380px;
            text-align: center;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.25);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        input {
            width: 92%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76,175,80,0.4);
        }

        .predict-btn {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s ease;
        }

        .predict-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        /* Prediction Result */
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f4fdf4;
            border-left: 5px solid #4CAF50;
            border-radius: 8px;
            color: #2c3e50;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Top Right Buttons -->
    <div class="top-buttons">

        <a href="{{ url_for('profile') }}">
            <button class="profile-btn">Profile</button>
        </a>

        

    </div>

    <!-- Main Prediction Form -->
    <div class="container">
        <h2>House Price Prediction</h2>

        <form action="{{ url_for('predict') }}" method="post">

            <input type="text" name="location" value="{{ location or '' }}" placeholder="Enter Location" required>

            <input type="text" name="area" value="{{ area or '' }}" placeholder="Enter Area (sq ft)" required>

            <input type="text" name="bedrooms" value="{{ bedrooms or '' }}" placeholder="Enter Bedrooms" required>

            <input type="text" name="bathrooms" value="{{ bathrooms or '' }}" placeholder="Enter Bathrooms" required>

            <button type="submit" class="predict-btn">Predict Price</button>

        </form>

        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}
    </div>

</body>
</html>
