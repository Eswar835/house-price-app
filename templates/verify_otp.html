<!DOCTYPE html>
<html>
<head>
    <title>Email Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
        }

        input {
            width: 92%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            letter-spacing: 2px;
        }

        button {
            width: 95%;
            padding: 10px;
            margin-top: 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #0056b3;
        }

        .resend-btn {
            background: #28a745;
        }

        .resend-btn:hover {
            background: #1f7d34;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }

        .message {
            color: green;
            margin-bottom: 10px;
        }

        a {
            text-decoration: none;
            color: #007bff;
        }

        .back {
            margin-top: 15px;
            font-size: 14px;
        }

        .resend-form {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Email Verification</h2>

        <p>Enter the OTP sent to your email</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        <form method="POST" action="/verify_email">
            <input type="text" name="otp" placeholder="Enter OTP" maxlength="6" required>
            <button type="submit">Verify Email</button>
        </form>

        <form method="POST" action="/resend_otp" class="resend-form">
            <button type="submit" class="resend-btn">Resend OTP</button>
        </form>

        <div class="back">
            <a href="/register">Back to Register</a>
        </div>
    </div>
</body>
</html>
